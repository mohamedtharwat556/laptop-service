<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم طلب Hikvision - مركز خدمة لابتوب YAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/ai-animations.css">
    <link rel="stylesheet" href="css/advanced-animations.css">
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="assets/videos/Technician_repairing_laptop_in_workshop_202608191242.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/images/yas-logo.svg" alt="YAS Logo" class="logo-img">
                <span class="logo-text">
                    <span class="logo-name">YAS</span>
                    <span class="logo-sub">LAPTOP SERVICE</span>
                </span>
            </a>
            <button class="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">الرئيسية</a></li>
                <li><a href="customer.html" class="nav-link active">تقديم طلب</a></li>
                <li><a href="track.html" class="nav-link">متابعة الطلب</a></li>
                <li><button class="btn btn-danger" onclick="staffLogout()" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button></li>
                <li><button class="dark-mode-toggle" id="darkModeToggle" title="تبديل الوضع الليلي">
                    <i class="fas fa-moon"></i>
                </button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="section animate__animated animate__fadeInUp" style="padding-top: 120px;">
        <h2 class="section-title">تقديم طلب Hikvision</h2>
        <div class="form-container glass-card" id="requestFormContainer">
            <form id="requestForm">
                <div class="form-group">
                    <label class="form-label">الاسم الكامل *</label>
                    <input type="text" class="form-input" name="fullName" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label class="form-label">رقم الهاتف *</label>
                    <input type="tel" class="form-input" name="phone" required placeholder="أدخل رقم هاتفك" id="phoneInput">
                </div>
                <div class="form-group">
                    <label class="form-label">موديل Hikvision *</label>
                    <select class="form-input" name="laptopModel" required id="hikvisionModelSelect">
                        <option value="">اختر موديل الجهاز</option>
                        <option value="DS-D5B65RD/C 8-128">Hikvision DS-D5B65RD/C 8-128</option>
                        <option value="DS-D5B65RB/EP 8-128">Hikvision DS-D5B65RB/EP 8-128</option>
                        <option value="DS-D5B65RD/D 8-128">Hikvision DS-D5B65RD/D 8-128</option>
                        <option value="DS-D5B65RB/FL 8-128">Hikvision DS-D5B65RB/FL 8-128</option>
                        <option value="DS-D5A65RB/A2 8-128">Hikvision DS-D5A65RB/A2 8-128</option>
                        <option value="DS-D5A75RB/A2 8-128">Hikvision DS-D5A75RB/A2 8-128</option>
                        <option value="DS-D5B86RB/EL 8-128">Hikvision DS-D5B86RB/EL 8-128</option>
                        <option value="DS-D5B65RB/EL 8-64">Hikvision DS-D5B65RB/EL 8-64</option>
                        <option value="DS-D5A65RB/A3 8-128">Hikvision DS-D5A65RB/A3 8-128</option>
                        <option value="DS-D5A75RB/A3 8-128">Hikvision DS-D5A75RB/A3 8-128</option>
                        <option value="DS-D5A75RB/B3 8-128">Hikvision DS-D5A75RB/B3 8-128</option>
                        <option value="DS-D6055UT-D/S 4-32">Hikvision DS-D6055UT-D/S 4-32</option>
                        <option value="DS-D6055UN-D/S 4-32">Hikvision DS-D6055UN-D/S 4-32</option>
                        <option value="DS-D5B75RB/B2L 8-128">Hikvision DS-D5B75RB/B2L 8-128</option>
                        <option value="DS-D5C65RB/B2L 8-128">Hikvision DS-D5C65RB/B2L 8-128</option>
                        <option value="DS-D5B86RB/B2L 8-128">Hikvision DS-D5B86RB/B2L 8-128</option>
                        <option value="DS-D5B65RB/EL 8-128">Hikvision DS-D5B65RB/EL 8-128</option>
                        <option value="DS-D5B86RB/EL 8-64">Hikvision DS-D5B86RB/EL 8-64</option>
                        <option value="DS-D5B65RB/FP 8-128">Hikvision DS-D5B65RB/FP 8-128</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">تاريخ الاستلام *</label>
                    <input type="date" class="form-input" name="receivedDate" required id="receivedDate">
                </div>
                <div class="form-group">
                    <label class="form-label">وصف المشكلة *</label>
                    <textarea class="form-textarea" name="problemDescription" required placeholder="يرجى وصف المشكلة التي تواجهها مع جهازك..."></textarea>
                </div>
                <button type="button" onclick="hikvisionCustomerManager.submitForm()" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-paper-plane"></i>
                     إرسال الطلب
                </button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>YAS Laptop Service</h4>
                <p>شريكك الموثوق لجميع احتياجات صيانة وإصلاح الحواسيب المحمولة.</p>
            </div>
            <div class="footer-section">
                <h4>روابط سريعة</h4>
                <a href="index.html">الرئيسية</a>
                <a href="customer.html">تقديم طلب صيانة</a>
                <a href="track.html">تتبع حالة الطلب</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>جميع الحقوق محفوظة &copy; 2026 لمركز ياس لصيانة اللابتوب</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/storage-api.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check if Hikvision admin is logged in
        const loggedInHikvision = localStorage.getItem('loggedInHikvision');
        if (!loggedInHikvision) {
            window.location.href = 'hikvision-login.html';
        }

        // Logout function
        function hikvisionLogout() {
            localStorage.removeItem('loggedInHikvision');
            window.location.href = 'hikvision-login.html';
        }
    </script>
    <script src="js/hikvision-customer.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script>
        // Set today's date as default for received date
        document.addEventListener('DOMContentLoaded', () => {
            const receivedDate = document.getElementById('receivedDate');
            if (receivedDate) {
                receivedDate.value = new Date().toISOString().slice(0, 10);
            }
            
            // Handle laptop brand selection
            const laptopBrandSelect = document.getElementById('laptopBrandSelect');
            const laptopBrandOther = document.getElementById('laptopBrandOther');
            
            if (laptopBrandSelect && laptopBrandOther) {
                laptopBrandSelect.addEventListener('change', () => {
                    if (laptopBrandSelect.value === 'Other') {
                        laptopBrandOther.style.display = 'block';
                        laptopBrandOther.required = true;
                    } else {
                        laptopBrandOther.style.display = 'none';
                        laptopBrandOther.required = false;
                        laptopBrandOther.value = '';
                    }
                });
            }
        });

        // Enable phone number editing
        window.enablePhoneEdit = function() {
            const phoneInput = document.getElementById('phoneInput');
            if (phoneInput) {
                phoneInput.readOnly = false;
                phoneInput.focus();
                phoneInput.style.background = 'rgba(59, 130, 246, 0.1)';
                phoneInput.style.border = '1px solid rgba(59, 130, 246, 0.5)';
            }
        };
    </script>
</body>
</html>
