<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب صيانة جملة - YAS Laptop Service</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="assets/images/yas-logo.svg" alt="YAS Logo" style="width: 50px; height: 50px;">
                <span class="logo-text">YAS</span>
                <span class="logo-sub">LAPTOP SERVICE</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">الرئيسية</a>
                <a href="customer.html" class="nav-link">طلب عادي</a>
                <a href="bulk-customer.html" class="nav-link active">طلب جملة</a>
                <a href="track.html" class="nav-link">تتبع الطلب</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="glass-card" style="max-width: 900px; margin: 2rem auto;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h1 style="color: #3b82f6; margin-bottom: 0.5rem;">📦 طلب صيانة جملة</h1>
                    <p style="color: #94a3b8;">للعملاء الذين يرغبون في صيانة أكثر من لابتوب في نفس الوقت</p>
                </div>

                <form id="bulkRequestForm">
                    <!-- Customer Information -->
                    <div style="background: rgba(59, 130, 246, 0.1); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid rgba(59, 130, 246, 0.2);">
                        <h3 style="color: #3b82f6; margin-bottom: 1rem;"><i class="fas fa-user"></i> معلومات العميل</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">الاسم الكامل *</label>
                                <input type="text" class="form-input" name="fullName" required placeholder="أدخل اسمك الكامل">
                            </div>
                            <div class="form-group">
                                <label class="form-label">رقم الهاتف *</label>
                                <input type="tel" class="form-input" name="phone" required placeholder="01xxxxxxxxx" dir="ltr">
                            </div>
                            <div class="form-group">
                                <label class="form-label">البريد الإلكتروني</label>
                                <input type="email" class="form-input" name="email" placeholder="example@email.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">عدد اللابتوبات *</label>
                                <input type="number" class="form-input" name="deviceCount" id="deviceCount" required min="2" max="100" value="2">
                            </div>
                        </div>
                    </div>

                    <!-- Devices Section -->
                    <div id="devicesContainer">
                        <!-- Devices will be added dynamically here -->
                    </div>

                    <button type="button" id="addDeviceBtn" class="btn btn-secondary" style="width: 100%; margin: 1rem 0;">
                        <i class="fas fa-plus"></i> إضافة لابتوب آخر
                    </button>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                        <i class="fas fa-paper-plane"></i> إرسال طلب الجملة
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 YAS Laptop Service. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/bulk-customer.js"></script>
</body>
</html>
