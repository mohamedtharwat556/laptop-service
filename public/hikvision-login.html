<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول Hikvision - مركز خدمة لابتوب YAS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/ai-animations.css">
    <link rel="stylesheet" href="css/advanced-animations.css">
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="assets/videos/Technician_repairing_laptop_in_workshop_202608191242.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/images/yas-logo.svg" alt="YAS Logo" class="logo-img">
                <span class="logo-text">
                    <span class="logo-name">YAS</span>
                    <span class="logo-sub">LAPTOP SERVICE</span>
                </span>
            </a>
            <button class="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">الرئيسية</a></li>
                <li><button class="dark-mode-toggle" id="darkModeToggle" title="تبديل الوضع الليلي">
                    <i class="fas fa-moon"></i>
                </button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="section animate__animated animate__fadeInUp" style="padding-top: 120px;">
        <h2 class="section-title">تسجيل دخول Hikvision</h2>
        <div class="form-container glass-card" style="max-width: 500px; margin: 0 auto;">
            <form id="hikvisionLoginForm">
                <div class="form-group">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-input" name="username" required placeholder="أدخل اسم المستخدم" id="hikvisionUsername">
                </div>
                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <div style="position: relative;">
                        <input type="password" class="form-input" name="password" required placeholder="أدخل كلمة المرور" id="hikvisionPassword" style="padding-left: 3rem;">
                        <button type="button" onclick="toggleHikvisionPassword()" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; padding: 0;">
                            <i class="fas fa-eye" id="hikvisionEyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>
            <div id="hikvisionLoginError" style="display: none; color: #ef4444; margin-top: 1rem; text-align: center; padding: 0.75rem; background: rgba(239, 68, 68, 0.1); border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3);">
                <i class="fas fa-exclamation-circle"></i>
                <span id="hikvisionErrorMessage">اسم المستخدم أو كلمة المرور غير صحيحة</span>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/hikvision-login.js"></script>
</body>
</html>
